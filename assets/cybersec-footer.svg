<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130" role="img" aria-labelledby="title desc">
  <title id="title">Cyber Sec — authorized security testing only</title>
  <desc id="desc">A sentinel blue footer with Cyber Sec's authorized-testing statement and website.</desc>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#020508"/>
      <stop offset="1" stop-color="#06192d"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1e80ff" stroke-opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="1200" height="130" rx="14" fill="url(#fade)"/>
  <rect width="1200" height="130" rx="14" fill="url(#grid)"/>
  <path d="M44 29H1156" stroke="#1e80ff" stroke-opacity="0.45"/>
  <rect x="44" y="54" width="7" height="38" fill="#1e80ff"/>
  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="70" y="70" fill="#e0efff" font-size="25" font-weight="700" letter-spacing="1.5">SCOPED. EVIDENCED. DEFENDED.</text>
    <text x="70" y="98" fill="#7396c4" font-family="'Courier New',monospace" font-size="15" letter-spacing="1">ALL SECURITY TESTING REQUIRES WRITTEN AUTHORIZATION.</text>
    <text x="1156" y="78" text-anchor="end" fill="#00aadd" font-family="'Courier New',monospace" font-size="21" font-weight="700">CYBERSEC.ORG.ZA</text>
  </g>
  <rect x="1" y="1" width="1198" height="128" rx="13" fill="none" stroke="#1e80ff" stroke-opacity="0.32" stroke-width="2"/>
</svg>
